appId: cpl.cpl
name: "The home screen leads to praying: the hours, the saint's sheet and the Aa button"
---
- runFlow: subflows/obrir.yaml
# An hour opens from the home screen, with the full name in the header and the Aa button
- tapOn: "Ofici de lectura"
- extendedWaitUntil:
    visible: "HIMNE.*"
    timeout: 15000
- assertVisible: "Ofici de lectura"
- tapOn: "Mida del text i tema"
- assertVisible: "Mida 3 de 10"
- tapOn: "Text més gran"
- assertVisible: "Mida 4 de 10"
- takeScreenshot: 07-full-aa
- tapOn: "Text més petit"
- tapOn: "Fet"
- assertNotVisible: "Mida 3 de 10"
- runFlow: subflows/enrere.yaml
- assertVisible: "Missatge"
# «Llegeix-ne més» opens the saint's life in a sheet; «Tanca» closes it, and on Android
# so does the back button. Only on the days when the day's saint has one.
- runFlow:
    when:
      visible: "Llegeix-ne més"
    commands:
      - tapOn: "Llegeix-ne més"
      - assertVisible: "Tanca"
      - takeScreenshot: 07-full-sant
      - tapOn: "Tanca"
      - assertNotVisible: "Tanca"
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn: "Llegeix-ne més"
            - assertVisible: "Tanca"
            - back
            - assertNotVisible: "Tanca"
            - assertVisible: "Missatge"
