appId: cpl.cpl
name: "The screenshots the stores show"
---
# The screenshots of the App Store and of Google Play, taken from the app itself. It is not a
# test: nothing is asserted beyond what has to be on screen before pressing the shutter, and a
# failure here means the shot is wrong, not the app.
#
# It is not run by `make ui-tests`: Maestro only picks up the flows of the folder it is given,
# and this one lives in its own. It is run by `make captures`, which boots the device of each
# size, installs the release and composes the shots. The names here are bare because Maestro
# keeps every screenshot inside the folder it is given in --test-output-dir and refuses a path
# that points anywhere else.
#
# The day is today's. To use another one, open the app first, pick the day in the calendar and
# run this flow without `clearState`: the flow opens the calendar only to photograph it, and
# leaves without picking a day.
- runFlow: ../subflows/obrir.yaml

# 1. The home screen: the whole day in one screen
- takeScreenshot: 01-inici

# 7 and 8. The calendar: the month painted with the liturgical year, and the year as a wheel.
# The shot waits for the ranks of the month, which come after the grid, and for the name of the
# day on its card.
- tapOn: "Calendari"
- extendedWaitUntil:
    visible:
      id: "calendar-day-[0-9]+-(memory|feast|solemnity)"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "calendar-preview-waiting"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 07-calendari
- tapOn: "Any litúrgic"
- extendedWaitUntil:
    visible:
      id: "calendar-milestone-.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 08-any-liturgic
# Back with today picked, the same on Android and iOS: on the calendar a swipe to the right turns
# the month, and only the very edge goes back
- tapOn: "Mes"
- tapOn: "Selecciona"
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 15000

# 2. Laudes: the text, the same one as in the books
- tapOn: "Laudes"
- extendedWaitUntil:
    visible: "HIMNE.*"
    timeout: 15000
- takeScreenshot: 02-laudes

# 3. The Aa sheet, over the prayer it changes
- tapOn: "Mida del text i tema"
- assertVisible: "Mida 3 de 10"
- takeScreenshot: 03-lletra
- tapOn: "Fet"

# 9 and 10. Lauds read aloud: the strophe being said marked on the screen and the small player at
# the foot, once it says how far it is; then its sheet, with the parts and the pace
- tapOn: "Escolta la pregària"
- extendedWaitUntil:
    visible: ".* de [0-9]+:[0-9]+"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 09-escoltar
- tapOn:
    id: "listen-open"
- extendedWaitUntil:
    visible: "Velocitat"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 10-reproductor
- tapOn: "Atura"
- runFlow: ../subflows/enrere.yaml
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 15000

# 4. The Gospel of the day, from the home screen
- tapOn: "Evangeli"
- extendedWaitUntil:
    visible: "EVANGELI.*"
    timeout: 15000
- takeScreenshot: 04-evangeli
- runFlow: ../subflows/enrere.yaml
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 15000

# 12 and 11. Configuració: the diocese found with the location, and today's audio on the phone
- tapOn: "Configuració"
- assertVisible: "Mida del text"
- scrollUntilVisible:
    element: "Fes servir la meva ubicació.*"
    direction: DOWN
- takeScreenshot: 12-diocesi
- scrollUntilVisible:
    element: "Baixa l'àudio d'avui"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 11-audio-avui
- runFlow: ../subflows/enrere.yaml
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 15000

# 5 and 6. The same app at night. Compline is the hour that is prayed in the dark.
- tapOn: "Configuració"
- assertVisible: "Mida del text"
- tapOn: "Fosc"
- runFlow: ../subflows/enrere.yaml
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 15000
- takeScreenshot: 06-inici-fosc
- tapOn: "Completes"
- extendedWaitUntil:
    visible: "HIMNE.*"
    timeout: 15000
- takeScreenshot: 05-completes-fosc

# 13. Compline read aloud, in the dark
- tapOn: "Escolta la pregària"
- extendedWaitUntil:
    visible: ".* de [0-9]+:[0-9]+"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 13-escoltar-fosc
- tapOn:
    id: "listen-close"
