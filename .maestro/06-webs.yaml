appId: cpl.cpl
name: "S'obren les pàgines de contacte i de donatiu"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 60000
- tapOn: "Missatge"
- assertVisible: "Missatge"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 06-missatge
- runFlow: subflows/enrere.yaml
- tapOn: "Donatiu lliure"
# Android l'obre dins l'app; iOS surt cap a Stripe a Safari i cal tornar a l'app
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Donatiu lliure"
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: 06-donatiu
      - runFlow: subflows/enrere.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: 06-donatiu-safari
      - launchApp
- assertVisible: "Missatge"
