appId: cpl.cpl
name: "La configuració es desa i canvia la litúrgia"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 60000
- tapOn: "Configuració"
- assertVisible: "Diòcesi"
- takeScreenshot: 04-configuracio
# Diòcesi: Barcelona → Andorra, i mode obscur: Automàtic → Activat. Són les primeres opcions
# de cada selector: Android obre una llista i es tria; a iOS són rodes que no exposen les
# files, i lliscar cap avall les porta sempre a la primera.
- runFlow:
    when:
      platform: Android
    commands:
      # El desplegable s'obre amb l'opció actual a dalt: les anteriors queden per sobre
      - tapOn: "Barcelona"
      - scrollUntilVisible:
          element: "Andorra"
          direction: UP
      - tapOn: "Andorra"
      - tapOn: "Automàtic"
      - scrollUntilVisible:
          element: "Activat"
          direction: UP
      - tapOn: "Activat"
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          from: "Barcelona"
          direction: DOWN
      - waitForAnimationToEnd
      - swipe:
          from: "Automàtic"
          direction: DOWN
      - waitForAnimationToEnd
# A iOS les rodes ocupen molt i la versió queda més avall. Es desplaça des del marge
# esquerre, on hi ha les etiquetes: un lliscament al mig cauria sobre una roda i la mouria.
- repeat:
    times: 4
    while:
      notVisible: "Versió de la base de dades: .*"
    commands:
      - swipe:
          start: "8%, 80%"
          end: "8%, 30%"
- assertVisible: "Versió de la base de dades: .*"
- runFlow: subflows/enrere.yaml
- extendedWaitUntil:
    visible: "Andorra \\(Diòcesi\\).*"
    timeout: 15000
- takeScreenshot: 04-andorra
# L'inici té un fons fix; el mode fosc es veu dins de les hores
- tapOn: "Litúrgia de les hores"
- tapOn: "Laudes"
- extendedWaitUntil:
    visible: "HIMNE.*"
    timeout: 15000
- takeScreenshot: 04-laudes-mode-fosc
- runFlow: subflows/enrere.yaml
- tapOn: "Inici"
# Es manté després de tancar i tornar a obrir l'app
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Andorra \\(Diòcesi\\).*"
    timeout: 60000
