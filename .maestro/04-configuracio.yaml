appId: cpl.cpl
name: "La configuració es desa i canvia la litúrgia"
---
- runFlow: subflows/obrir.yaml
- tapOn: "Configuració"
- assertVisible: "Mida del text"
- takeScreenshot: 04-configuracio
# Diòcesi: Barcelona → Andorra, en el full amb la llista. A Android es toca el text del valor;
# a iOS la fila és un sol botó, «Diòcesi: Barcelona».
- tapOn: "(Diòcesi: )?Barcelona"
- tapOn: "Andorra"
# Tema: Automàtic → Fosc, amb els tres botons
- tapOn: "Fosc"
- scrollUntilVisible:
    element: "(?s).*Versió de la base de dades: .*"
    direction: DOWN
- runFlow: subflows/enrere.yaml
- extendedWaitUntil:
    visible: "Andorra \\(Diòcesi\\).*"
    timeout: 15000
# Amb el tema fosc, també l'inici és fosc
- takeScreenshot: 04-andorra-mode-fosc
- tapOn: "Laudes"
- extendedWaitUntil:
    visible: "HIMNE.*"
    timeout: 15000
- takeScreenshot: 04-laudes-mode-fosc
- runFlow: subflows/enrere.yaml
# Es manté després de tancar i tornar a obrir l'app
- stopApp
- launchApp
# L'inici, o l'avís de mitjanit a sobre (de 0 a 3 h), que el tapa
- extendedWaitUntil:
    visible: "Andorra \\(Diòcesi\\).*|No, la d.avui"
    timeout: 60000
- tapOn:
    text: "No, la d.avui"
    optional: true
- extendedWaitUntil:
    visible: "Andorra \\(Diòcesi\\).*"
    timeout: 15000
