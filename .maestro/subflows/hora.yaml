appId: cpl.cpl
---
- tapOn: ${HORA}
- extendedWaitUntil:
    visible: "HIMNE.*"
    timeout: 15000
- takeScreenshot: hora-${HORA}
# The Office of Readings, with two readings, is very long: fast scrolling and a wide margin.
# On Android the title is sewn into one text with the prayer below it (PrayerFlow), and Maestro
# matches whole texts: the one that starts with it, as with «HIMNE.*» above.
- scrollUntilVisible:
    element: "(?s)${FINAL}.*"
    direction: DOWN
    speed: 90
    timeout: 180000
- runFlow: enrere.yaml
