appId: cpl.cpl
---
# L'app com acabada d'instal·lar, al dia d'avui, amb l'inici a punt. Tanca els avisos que
# poden sortir en obrir-la: el de mitjanit (de 0 a 3 h, «No, la d'avui») i el de novetats, que
# surt la primera vegada.
- launchApp:
    clearState: true
# L'inici, o l'avís de mitjanit a sobre: és un modal, i mentre hi és l'inici no es veu
- extendedWaitUntil:
    visible: "Missatge|No, la d.avui"
    timeout: 60000
- tapOn:
    text: "No, la d.avui"
    optional: true
- tapOn:
    text: "D.acord"
    optional: true
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 15000
