appId: cpl.cpl
---
# The app as just installed, on today, with the home screen ready. It closes the notices that
# can appear when opening it: the midnight one (from 0 to 3 h, «No, la d'avui») and the what's
# new one, shown only to someone from the previous version (after clearState it should not).
- launchApp:
    clearState: true
# The home screen, or one of the notices on top of it (the midnight one or the what's new one):
# they are modal, and while they are there the home screen is not visible
- extendedWaitUntil:
    visible: "Missatge|No, la d.avui|D.acord"
    timeout: 60000
- tapOn:
    text: "No, la d.avui"
    optional: true
- tapOn:
    text: "D.acord"
    optional: true
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 15000
