appId: cpl.cpl
name: "S'obren les lectures de la missa"
---
- runFlow: subflows/obrir.yaml
# Els botons de les lectures són a l'inici
- tapOn: "Evangeli"
- extendedWaitUntil:
    visible: "Lectura de l.evangeli.*"
    timeout: 15000
- takeScreenshot: 03-evangeli
- runFlow: subflows/enrere.yaml
# La primera lectura (a la Vetlla Pasqual no n'hi ha), i «Continua amb el Salm» mostra el salm
- runFlow:
    when:
      visible: "Primera lectura"
    commands:
      - tapOn: "Primera lectura"
      - scrollUntilVisible:
          element: "Continua amb el Salm"
          direction: DOWN
          speed: 90
          timeout: 60000
      - takeScreenshot: 03-primera-lectura
      - tapOn: "Continua amb el Salm"
      - scrollUntilVisible:
          element: "(?i)salm responsorial"
          direction: DOWN
          speed: 60
          timeout: 30000
      - runFlow: subflows/enrere.yaml
- assertVisible: "Missatge"
