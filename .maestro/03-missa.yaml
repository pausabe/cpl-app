appId: cpl.cpl
name: "The Mass readings open"
---
- runFlow: subflows/obrir.yaml
# The buttons for the readings are on the home screen
- tapOn: "Evangeli"
- extendedWaitUntil:
    visible: "Lectura de l.evangeli.*"
    timeout: 15000
- takeScreenshot: 03-evangeli
- runFlow: subflows/enrere.yaml
# The first reading (none at the Easter Vigil), and «Continua amb el Salm» shows the psalm
- runFlow:
    when:
      visible: "Primera lectura"
    commands:
      - tapOn: "Primera lectura"
      - scrollUntilVisible:
          element: "Continua amb el Salm"
          direction: DOWN
          speed: 90
          timeout: 60000
      - takeScreenshot: 03-primera-lectura
      - tapOn: "Continua amb el Salm"
      - scrollUntilVisible:
          element: "(?i)salm responsorial"
          direction: DOWN
          speed: 60
          timeout: 30000
      - runFlow: subflows/enrere.yaml
- assertVisible: "Missatge"
