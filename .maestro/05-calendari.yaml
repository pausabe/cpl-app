appId: cpl.cpl
name: "Es pot canviar de dia amb el calendari"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Missatge"
    timeout: 60000
- tapOn: "Calendari"
# El dia 15 del mes que mostra, i acceptar. Android obre el seu diàleg de data; a iOS l'app
# té un calendari propi amb els botons Cancel·la / Avui / Canvia.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "15"
          index: 0
      - tapOn: "OK|D'acord|Acceptar|Aceptar"
- runFlow:
    when:
      platform: iOS
    commands:
      # Cada dia és un botó «dimarts, 15 de setembre» / «Tuesday, September 15», segons
      # l'idioma del sistema
      - tapOn: "[^ ]+, ([^ ]+ 15|15 .+)"
      - tapOn: "Canvia"
- extendedWaitUntil:
    visible: ".* - 15/[0-9]{2}/[0-9]{4}"
    timeout: 15000
- takeScreenshot: 05-dia-15
# I les hores d'aquell dia s'obren
- tapOn: "Litúrgia de les hores"
- runFlow:
    file: subflows/hora.yaml
    env: { HORA: "Laudes", FINAL: "ORACIÓ" }
