appId: cpl.cpl
name: "Es pot canviar de dia amb el calendari"
---
- runFlow: subflows/obrir.yaml
- tapOn: "Calendari"
# El dia 15 del mes que mostra, i acceptar. Android obre el seu diàleg de data; a iOS l'app
# té un calendari propi amb els botons Cancel·la / Avui / Canvia.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "15"
          index: 0
      - tapOn: "OK|D'acord|Acceptar|Aceptar"
- runFlow:
    when:
      platform: iOS
    commands:
      # Cada dia és un botó «dimarts, 15 de setembre»
      - tapOn: "[^ ]+, ([^ ]+ 15|15 .+)"
      - tapOn: "Canvia"
# La data, en paraules a la targeta del dia
- extendedWaitUntil:
    visible: "Di[a-z]+, 15 d.+"
    timeout: 15000
- takeScreenshot: 05-dia-15
# I les hores d'aquell dia s'obren
- runFlow:
    file: subflows/hora.yaml
    env: { HORA: "Laudes", FINAL: "ORACIÓ" }
