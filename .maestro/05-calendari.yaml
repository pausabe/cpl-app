appId: cpl.cpl
name: "The day can be changed with the calendar"
---
- runFlow: subflows/obrir.yaml
- tapOn: "Calendari"
# The title of the month opens the list of years: last year, in the same month
- tapOn:
    id: "calendar-title"
- assertVisible:
    id: "calendar-years"
- tapOn:
    id: "calendar-year-${new Date().getFullYear() - 1}"
- assertVisible: ".* de ${new Date().getFullYear() - 1}"
# The app's calendar, the same on Android and iOS: day 15 of the month it shows, and «Canvia».
# Each day is a button «dimarts, 15 de setembre» with the number inside: on Android the number
# is tapped; on iOS, the button.
- tapOn: "15|[^ ]+, 15 d.+"
- tapOn: "Canvia"
# The date, in words on the day's card
- extendedWaitUntil:
    visible: "Di[a-z]+, 15 d.+"
    timeout: 15000
- takeScreenshot: 05-dia-15
# And the hours of that day open
- runFlow:
    file: subflows/hora.yaml
    env: { HORA: "Laudes", FINAL: "ORACIÓ" }
