appId: cpl.cpl
name: "Es pot canviar de dia amb el calendari"
---
- runFlow: subflows/obrir.yaml
- tapOn: "Calendari"
# El calendari de l'app, igual a Android i a iOS: el dia 15 del mes que mostra, i «Canvia».
# Cada dia és un botó «dimarts, 15 de setembre» amb el número a dins: a Android es toca el
# número; a iOS, el botó.
- tapOn: "15|[^ ]+, 15 d.+"
- tapOn: "Canvia"
# La data, en paraules a la targeta del dia
- extendedWaitUntil:
    visible: "Di[a-z]+, 15 d.+"
    timeout: 15000
- takeScreenshot: 05-dia-15
# I les hores d'aquell dia s'obren
- runFlow:
    file: subflows/hora.yaml
    env: { HORA: "Laudes", FINAL: "ORACIÓ" }
