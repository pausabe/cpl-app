appId: cpl.cpl
name: "The day can be changed with the calendar"
---
- runFlow: subflows/obrir.yaml
- tapOn: "Calendari"
# The calendar is a screen of its own. Its tab «Any», the year before, and the same month in it
- tapOn: "Any"
- tapOn: "Any anterior"
- tapOn:
    id: "calendar-year-month-${new Date().getMonth() + 1}"
- assertVisible: ".* de ${new Date().getFullYear() - 1}"
# The app's calendar, the same on Android and iOS: day 15 of the month it shows, and «Mostra aquest
# dia». Each day is a button «dimarts, 15 de setembre» (and its rank, if it has one) with the number
# inside: on Android the number is tapped; on iOS, the button.
- tapOn: "15|[^ ]+, 15 d.+"
- tapOn: "Mostra aquest dia"
# The date, in words on the day's card
- extendedWaitUntil:
    visible: "Di[a-z]+, 15 d.+"
    timeout: 15000
- takeScreenshot: 05-dia-15
# And the hours of that day open
- runFlow:
    file: subflows/hora.yaml
    env: { HORA: "Laudes", FINAL: "ORACIÓ" }
